<svg xmlns="http://www.w3.org/2000/svg" width="700" height="760" viewBox="0 0 700 760" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" data-palette="56e678-6ae7ca-b6f6ac-dbf2d4e05503" role="img">
  <title>SubSweep 架构（窄幅）：导出 → 解析 → 记录 → 知识库匹配 → 报告 → 本地服务</title>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56e678"/>
      <stop offset="1" stop-color="#6ae7ca"/>
    </linearGradient>
    
  </defs>
  <style>
    .an-flow { animation: kf-flow 2.6s linear infinite; }
    .an-blink { animation: kf-blink 2.8s ease-in-out infinite; }
    .an-drift { animation: kf-drift 5.2s ease-in-out infinite alternate; }
    .an-spin  { animation: kf-spin 26s linear infinite; transform-origin: 350px 380px; }
    @keyframes kf-flow { to { stroke-dashoffset: -128; } }
    @keyframes kf-blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes kf-drift { from { transform: translateY(-4px); } to { transform: translateY(4px); } }
    @keyframes kf-spin { to { transform: rotate(360deg); } }
    
    @media (prefers-reduced-motion: reduce) {
      .an-flow, .an-blink, .an-drift, .an-spin { animation: none !important; }
    }
  </style>
  <text x="28" y="44" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#95b9ae" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">subsweep — 单个 Go 二进制</text>
<rect x="40" y="64" width="620" height="72" rx="12" fill="#0c1719" stroke="#173c25" stroke-width="1"/>
<text x="58" y="94" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" font-size="13.5" fill="#f0fdee" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">支付宝导出 CSV · GB18030 · 27 笔</text>
<text x="58" y="116" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" fill="#95b9ae" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">元数据表头自动跳过</text>
<path d="M 350 140 L 350 140" fill="none" stroke="#173c25" stroke-width="1.2" opacity="0.6"/>
<path d="M 350 140 L 350 140" fill="none" stroke="url(#grad)" stroke-width="1.6" opacity="0.85" class="an-flow" style="animation-delay:0s" stroke-dasharray="7 9" stroke-linecap="round"/>
<polygon points="350,144 346.5,139 353.5,139" fill="#56e678"/>
<rect x="40" y="148" width="620" height="72" rx="12" fill="#0c1719" stroke="#173c25" stroke-width="1"/>
<text x="58" y="178" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" font-size="13.5" fill="#f0fdee" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">微信导出 CSV · UTF-8 (BOM) · 22 笔</text>
<text x="58" y="200" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" fill="#95b9ae" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">填充行自动跳过</text>
<path d="M 96 220 L 96 240" fill="none" stroke="#173c25" stroke-width="1.2" opacity="0.6"/>
<path d="M 96 220 L 96 240" fill="none" stroke="url(#grad)" stroke-width="1.6" opacity="0.85" class="an-flow" style="animation-delay:0.7s" stroke-dasharray="7 9" stroke-linecap="round"/>
<polygon points="96,244 92.5,239 99.5,239" fill="#56e678"/>
<rect x="40" y="248" width="620" height="72" rx="12" fill="#0c1719" stroke="#56e678" stroke-width="1.4"/>
<text x="58" y="278" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" font-size="13.5" fill="#f0fdee" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">bills parser</text>
<text x="58" y="300" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" fill="#95b9ae" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">格式探测 · 启发式检出</text>
<path d="M 350 324 L 350 340" fill="none" stroke="#173c25" stroke-width="1.2" opacity="0.6"/>
<path d="M 350 324 L 350 340" fill="none" stroke="url(#grad)" stroke-width="1.6" opacity="0.85" class="an-flow" style="animation-delay:1.4s" stroke-dasharray="7 9" stroke-linecap="round"/>
<polygon points="350,344 346.5,339 353.5,339" fill="#56e678"/>
<rect x="40" y="348" width="620" height="72" rx="12" fill="#0c1719" stroke="#173c25" stroke-width="1"/>
<text x="58" y="378" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" font-size="13.5" fill="#f0fdee" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">结构化扣款记录</text>
<text x="58" y="400" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" fill="#95b9ae" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">平台 · 商户 · 金额 · 日期</text>
<path d="M 350 424 L 350 440" fill="none" stroke="#173c25" stroke-width="1.2" opacity="0.6"/>
<path d="M 350 424 L 350 440" fill="none" stroke="url(#grad)" stroke-width="1.6" opacity="0.85" class="an-flow" style="animation-delay:2.0999999999999996s" stroke-dasharray="7 9" stroke-linecap="round"/>
<polygon points="350,444 346.5,439 353.5,439" fill="#56e678"/>
<rect x="40" y="448" width="620" height="72" rx="12" fill="#0c1719" stroke="#173c25" stroke-width="1"/>
<text x="58" y="478" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" font-size="13.5" fill="#f0fdee" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">catalog + match</text>
<text x="58" y="500" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" fill="#95b9ae" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">services.json 50 项 · 字典与模糊匹配 · 可选 LLM（默认关闭）</text>
<path d="M 350 524 L 350 540" fill="none" stroke="#173c25" stroke-width="1.2" opacity="0.6"/>
<path d="M 350 524 L 350 540" fill="none" stroke="url(#grad)" stroke-width="1.6" opacity="0.85" class="an-flow" style="animation-delay:2.8s" stroke-dasharray="7 9" stroke-linecap="round"/>
<polygon points="350,544 346.5,539 353.5,539" fill="#56e678"/>
<rect x="40" y="548" width="620" height="72" rx="12" fill="#0c1719" stroke="#56e678" stroke-width="1.4"/>
<text x="58" y="578" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" font-size="13.5" fill="#f0fdee" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">report</text>
<text x="58" y="600" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" fill="#95b9ae" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">年化月费×12 · 遗忘项排序 · MD / HTML / JSON</text>
<path d="M 350 624 L 350 640" fill="none" stroke="#173c25" stroke-width="1.2" opacity="0.6"/>
<path d="M 350 624 L 350 640" fill="none" stroke="url(#grad)" stroke-width="1.6" opacity="0.85" class="an-flow" style="animation-delay:3.5s" stroke-dasharray="7 9" stroke-linecap="round"/>
<polygon points="350,644 346.5,639 353.5,639" fill="#56e678"/>
<rect x="40" y="648" width="620" height="72" rx="12" fill="#0c1719" stroke="#173c25" stroke-width="1"/>
<text x="58" y="678" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#f0fdee" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">local server · 127.0.0.1:8787</text>
<text x="58" y="700" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" fill="#95b9ae" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">数据仅在内存 · 本地网页拖入账单、逐项确认</text>
<text x="28" y="756" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#95b9ae" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">除解析与匹配外全部使用 Go 标准库</text>
</svg>
