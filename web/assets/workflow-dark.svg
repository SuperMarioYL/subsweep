<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" data-palette="56e678-6ae7ca-b6f6ac-dbf2d4e05503" role="img">
  <title>SubSweep 流程：导出账单 → 拖入 → 逐项确认 → 报告 → 导出 → 本人取消</title>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56e678"/>
      <stop offset="1" stop-color="#6ae7ca"/>
    </linearGradient>
    
  </defs>
  <style>
    .an-flow { animation: kf-flow 2.6s linear infinite; }
    .an-blink { animation: kf-blink 2.8s ease-in-out infinite; }
    .an-drift { animation: kf-drift 5.2s ease-in-out infinite alternate; }
    .an-spin  { animation: kf-spin 26s linear infinite; transform-origin: 500px 235px; }
    @keyframes kf-flow { to { stroke-dashoffset: -128; } }
    @keyframes kf-blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes kf-drift { from { transform: translateY(-4px); } to { transform: translateY(4px); } }
    @keyframes kf-spin { to { transform: rotate(360deg); } }
    
    @media (prefers-reduced-motion: reduce) {
      .an-flow, .an-blink, .an-drift, .an-spin { animation: none !important; }
    }
  </style>
