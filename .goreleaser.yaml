version: 2

project_name: subsweep

builds:
  - id: subsweep
    main: .
    binary: subsweep
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ title .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  draft: false
